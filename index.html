<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>
<body>
  <main>
    <article class="card">
      <div class="circle"></div>
      <div class="group">
        <h3>Jessica Randall</h3>
        <p class="p-location">London, United Kingdom</p>
      </div>
      <p class="p-bio">"Front-end developer and avid reader."</p>
      <div class="socials-container">
        <a href="#" target="_blank">
          <div class="github socials-box" id="github">
            <h6>Github</h6>
          </div>
        </a>
        <a href="#">
          <div class="frontend-mentor socials-box" id="frontend-mentor">
            <h6>Frontend Mentor</h6>
          </div>
        </a>
        <a href="#">
          <div class="linkedin socials-box" id="linkedin">
            <h6>LinkedIn</h6>
          </div>
        </a>
        <a href="#">
          <div class="x socials-box" id="x">
            <h6>X</h6>
          </div>
        </a>
        <a href="#">
          <div class="instagram socials-box" id="instagram">
            <h6>Instagram</h6>
          </div>
        </a>
      </div>
    </article>
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">Lorenzo Robb</a>.
    </footer>
  </main>
</body>
</html>
